status_reporter:
  enabled: true
  topic: "tasks.status"

metrics:
  enabled: true
  port: 9100
  path: "/metrics"

api_server:
  enabled: true
  addr: ":8090"
  token: ""

logging:
  service_name: "datainjector-worker"
  environment: ""

tracing:
  enabled: true
  service_name: "datainjector-worker"
  sample_ratio: 0.01
  force_sample_run_id: true
  force_sample_role_ids: []

datasources:
  - id: "dune.sim"
    base_url: "https://api.sim.dune.com"
    protocol: "http"
    auth:
      type: "api_key_env"
      header: "X-Sim-Api-Key"
      api_key_env: "DUNE_SIM_API_KEY"
    rate_limit:
      capacity: 10
      refill_rate: 2
    doc_url: "https://docs.dune.com/api-reference"

  - id: "bigquery.api"
    base_url: "https://bigquery.googleapis.com/bigquery/v2"
    protocol: "http"
    auth:
      type: "bearer_env"
      bearer_token_env: "GOOGLE_CLOUD_API_KEY"
    rate_limit:
      capacity: 100
      refill_rate: 10

  - id: "binance.futures.ws"
    base_url: "wss://fstream.binance.com/ws"
    protocol: "websocket"
    rate_limit:
      capacity: 80
      refill_rate: 30

  - id: "binance.spot.ws"
    base_url: "wss://stream.binance.com:9443/ws"
    protocol: "websocket"
    rate_limit:
      capacity: 80
      refill_rate: 30

  - id: "binance.spot"
    base_url: "https://api.binance.com"
    protocol: "http"

  - id: "hyperliquid.ws"
    base_url: "wss://api.hyperliquid.xyz/ws"
    protocol: "websocket"
    rate_limit:
      capacity: 50
      refill_rate: 20

  - id: "hyperliquid.info"
    base_url: "https://api.hyperliquid.xyz"
    protocol: "http"

  - id: "geckoterminal"
    base_url: "https://api.geckoterminal.com/api/v2"
    protocol: "http"
    auth:
      type: "api_key_env"
      header: "x-api-key"
      api_key_env: "GECKOTERMINAL_API_KEY"
    rate_limit:
      capacity: 10
      refill_rate: 2

  - id: "mockprovider.ws"
    base_url: "ws://localhost:8090/ws"
    protocol: "websocket"

  - id: "mockprovider.http"
    base_url: "http://localhost:8090"
    protocol: "http"
