

datasources:
  - id: "dune.sim"
    base_url: "https://api.sim.dune.com"
    protocol: "http"
    auth:
      type: "api_key_env"
      header: "X-Sim-Api-Key"
      api_key_env: "DUNE_SIM_API_KEY"
    rate_limit:
      capacity: 10
      refill_rate: 2
    doc_url: "https://docs.sim.dune.com/"

  - id: "bigquery.api"
    base_url: "https://bigquery.googleapis.com/bigquery/v2"
    protocol: "http"
    auth:
      type: "bearer_env"
      bearer_token_env: "GOOGLE_CLOUD_API_KEY"
    rate_limit:
      capacity: 100
      refill_rate: 10

  - id: "binance.spot"
    base_url: "https://api.binance.com"
    protocol: "http"
    doc_url: "https://developers.binance.com/docs/binance-spot-api-docs/rest-api"


  - id: "geckoterminal"
    base_url: "https://api.geckoterminal.com/api/v2"
    protocol: "http"
    auth:
      type: "api_key_env"
      header: "x-api-key"
      api_key_env: "GECKOTERMINAL_API_KEY"
    rate_limit:
      capacity: 10
      refill_rate: 2
      doc_url:"https://www.geckoterminal.com/dex-api?utm_source=gt-apiguide&utm_medium=referral&utm_content=apiguide-menu"

roles:
  # Dune Token Holders 批量拉取任务
  - role_id: "token-holders"
    datasource_id: "dune.sim"
    data_form: "page"
    role_param: ["chain_id", "address"]
    url_config:
      path_template: "/v1/evm/token-holders/{chain_id}/{address}"
      method: "GET"
      page_size: 500
      page_request: "offset"
      page_response: "next_offset"
      doc_url: "https://developers.binance.com/docs/binance-spot-api-docs/rest-api/market-data-endpoints#klinecandlestick-data"
    sink_config:
      type: "localfile"
      data_field: "holders"
      output_dir: "runtime/data/dune/token-holders/{chain_id}/{address}"
      output_format: "json"
      filename_prefix: "holders"
      max_records_per_file: 10000

  # tokenliquidity 
  #可选参数chain eth ,token_address 0x514910771af9ca656af840dff83e8264ecf986ca
  - role_id: "token-liquidity"
    datasource_id: "geckoterminal"
    data_form: "single"
    url_config:
      path_template: "/networks/{chainid}/tokens/{token_address}"
      method: "GET"
      doc_url: "https://docs.coingecko.com/v3.0.1/reference/pool-address"
    sink_config:
      type: "localfile"
      output_dir: "runtime/data/geckoterminal/liquidity/{chainid}/{token_address}/token"
      output_format: "json"
      filename_prefix: "token"
      max_records_per_file: 10000

  # Binance LINK 现货 K线拉取
  - role_id: "kline-spot"
    datasource_id: "binance.spot"
    data_form: "single"
    role_param: ["symbol", "interval", "limit", "startTime", "endTime"]
    url_config:
      path_template: "/api/v3/klines"
      method: "GET" 
    sink_config:
      type: "localfile"
      output_dir: "runtime/data/binance/spot/kline/{symbol}/{startTime}"
      output_format: "json"
      filename_prefix: "kline_1m"
      max_records_per_file: 10000
