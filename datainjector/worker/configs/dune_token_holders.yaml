# Dune Token Holders 批量拉取配置
# 测试用例：以太坊 Chainlink Token

status_reporter:
  enabled: true
  brokers:
    - "localhost:9092"
  topic: "tasks.status"

metrics:
  enabled: true
  port: 9100
  path: "/metrics"

roles:
  - role_id: "dune-token-holders-batch"
    emitter: "kafka_command"
    emitter_config:
      brokers: ["localhost:9092"]
      topic: "batch.tasks"
      group_id: "worker.dune.batch"
    
    caller: "batch_file"
    caller_config:
      # API 配置
      endpoint: "https://api.sim.dune.com"
      path_template: "/v1/evm/token-holders/{chain_id}/{address}"
      headers:
        X-Sim-Api-Key: "${DUNE_SIM_API_KEY}"  # 从环境变量读取
      timeout_ms: 30000
      
      # 分页配置
      page_size: 500
      cursor_param: "offset"
      cursor_field: "next_offset"
      data_field: "holders"
      
      # 输出配置
      output_dir: "/tmp/dune/token-holders/{chain_id}/{address}"
      output_format: "json"  # json/csv/parquet
      filename_prefix: "holders"
      max_records_per_file: 10000
      
      # 限流配置
      rate_limit:
        capacity: 10
        refill_rate: 2  # 每秒补充2个令牌
      
      # Manifest 配置
      manifest:
        version: "1.0"
        checksum_algorithm: "md5"
        custom_fields:
          - name: "token_address"
            source: "params.address"
          - name: "chain_id"
            source: "params.chain_id"
          - name: "first_holder_address"
            source: "first_record.wallet_address"
          - name: "first_holder_balance"
            source: "first_record.balance"
          - name: "last_holder_address"
            source: "last_record.wallet_address"
          - name: "last_holder_balance"
            source: "last_record.balance"
    
    queue: { size: 100 }

