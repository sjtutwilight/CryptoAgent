roles:
  - role_id: "localnode-block"
    emitter: "polling"
    polling_interval: 2  # 秒
    caller: "sdk_call"
    caller_class: "LocalGetBlock"
    caller_params:
      rpc_endpoint: "http://localhost:8545"
      chain_id: "local"
      confirmations: 0
      max_blocks_per_poll: 5
      block_delay: 0
    handlers:
      - type: "dex_parser"
        with:
          chain_id: "local"
    sink:
      type: "kafka"
      with:
        brokers:
          - "localhost:9092"
        topic: "dex_transaction"
        key_from: ["chain_id", "tx_hash"]
    queue: { size: 5000 }

  - role_id: "account-balance-snapshot"
    emitter: "polling"
    polling_interval: 60
    caller: "sdk_call"
    caller_class: "balance_snapshot"
    caller_params:
      rpc_endpoint: "http://localhost:8545"
      chain_id: "31337"
      deployment_path: "../deployment.json"
    handlers:
      - type: "balance_parser"
        with:
          redis_addr: "localhost:6379"
          redis_timeout_ms: 2000
    sink:
      type: "kafka"
      with:
        brokers:
          - "localhost:9092"
        topic: "account_balance_snapshot"
        key_from: ["chain_id", "account_id", "asset_type", "biz_id"]
    queue: { size: 5000 }

  - role_id: "mockprovider-websocket"
    emitter: "single"
    caller: "native_call"
    caller_config:
      protocol: "websocket"
      url: "ws://localhost:8090/ws"
      backfill:
        ws:
          enabled: true
          rpc_method: "eth_getBlockByNumber"
          include_full_tx: false
        http:
          enabled: true
          endpoint: "http://localhost:8545"
          rpc_method: "eth_getBlockByNumber"
          include_full_tx: false
    caller_params:
      subscribe: "newHeads"
      heartbeat_ms: 30000
      poll_interval_ms: 500
    handlers:
      - type: "missing_detector"
        with:
          sequence_field: "block_number"
          eager_gap: 3
          max_range: 20
          max_delay_ms: 800
          hard_timeout_ms: 10000
          max_gap: 8
          sweep_interval_ms: 200
          bucket_ttl_ms: 3000
          max_buckets: 2000
          backfill:
            ws:
              enabled: true
              rpc_method: "eth_getBlockByNumber"
              include_full_tx: false
            http:
              enabled: true
              endpoint: "http://localhost:8545"
              rpc_method: "eth_getBlockByNumber"
              include_full_tx: false
    sink:
      type: "kafka"
      with:
        brokers:
          - "localhost:9092"
        topic: "chain.ethereum.blocks"
        key_from: ["chain_id", "block_number"]
    queue: { size: 5000 }
