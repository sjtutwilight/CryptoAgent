  - role_id: "binance-kline"
    emitter: "single"
    caller: "native_call"
    caller_config:
      protocol: "websocket"
      url: "wss://stream.binance.com:9443/ws"
    caller_params:
      message_format: "binance"
      streams:
        - "btcusdt@kline_1m"
        - "ethusdt@kline_5m"
      metadata_fields:
        symbol: "data.s"
        interval: "data.k.i"
        open_time: "data.k.t"
        close_time: "data.k.T"
        is_final: "data.k.x"
      static_metadata:
        datasource_id: "binance.spot"
      reconnect:
        backoff_base_seconds: 2
        backoff_max_seconds: 60
      auth:
        api_key_env: "BINANCE_API_KEY"
        secret_env: "BINANCE_API_SECRET"
    handlers:
      - type: "binance_kline_normalizer"
        with:
          exchange: "binance"
          drop_unfinished: false
    sink:
      type: "kafka"
      with:
        brokers:
          - "localhost:9092"
        topic: "binance.kline"
        key_from: ["symbol", "interval", "close_time"]
    queue: { size: 10000 }

