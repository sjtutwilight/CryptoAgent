status_reporter:
  enabled: true
  topic: "tasks.status"

# Prometheus metrics配置
metrics:
  enabled: true    # 是否启用metrics暴露
  port: 9100       # metrics HTTP端口
  path: "/metrics" # metrics路径

# Role registry only (not loaded by worker at runtime)
# File sink roles 已移至 roles_localfile.yaml
roles:

  - role_id: "localnode-block"
    template: "sdk_polling"
    pipeline: "localnode_block_pipeline"
    polling_interval: 2  # 秒
    caller_class: "LocalGetBlock"
    caller_params:
      rpc_endpoint: "http://localhost:8545"
      chain_id: "local"
      confirmations: 0
      max_blocks_per_poll: 5
      block_delay: 0
    queue: { size: 5000 }

  - role_id: "account-balance-snapshot"
    template: "sdk_polling"
    pipeline: "account_balance_snapshot_pipeline"
    polling_interval: 60
    caller_class: "balance_snapshot"
    caller_params:
      rpc_endpoint: "http://localhost:8545"
      chain_id: "31337"
      deployment_path: "../deployment.json"
    queue: { size: 5000 }

  - role_id: "binance-kline"
    datasource_id: "binance.spot.ws"
    template: "binance_spot_ws_stream"
    pipeline: "binance_kline_pipeline"
    caller_params:
      streams:
        - "btcusdt@kline_1m"
        - "btcusdt@kline_5m"
      metadata_fields:
        symbol: "data.s"
        interval: "data.k.i"
        open_time: "data.k.t"
        close_time: "data.k.T"
        is_final: "data.k.x"
      static_metadata:
        datasource_id: "binance.spot.ws"
      auth:
        api_key_env: "BINANCE_API_KEY"
        secret_env: "BINANCE_API_SECRET"
    queue: { size: 10000 }

  # Binance Perp
  - role_id: "binance-perp-btc-orderbook"
    datasource_id: "binance.futures.ws"
    template: "binance_perp_ws_stream"
    pipeline: "perp_orderbook_pipeline"
    caller_config:
      datasource_id: "binance.futures.ws"
      rate_limit:
        capacity: 80
        refill_rate: 30
      backfill:
        http:
          enabled: true
          transport: "rest"
          endpoint: "https://fapi.binance.com/fapi/v1/depth"
          method: "GET"
          datasource_id: "binance.futures.rest"
          query:
            symbol: "BTCUSDT"
            limit: "500"
    caller_params:
      streams:
        - "btcusdt@depth@100ms"
      metadata_fields:
        symbol: "data.s"
        event_time: "data.E"
    queue: { size: 5000 }

  - role_id: "binance-perp-btc-aggtrades"
    datasource_id: "binance.futures.ws"
    template: "binance_perp_ws_stream"
    pipeline: "binance_perp_aggtrades_pipeline"
    caller_params:
      streams:
        - "btcusdt@aggTrade"
      static_metadata:
        symbol: "BTCUSDT"
        exchange: "binance"
    queue: { size: 3000 }

  - role_id: "binance-perp-aave-orderbook"
    datasource_id: "binance.futures.ws"
    template: "binance_perp_ws_stream"
    pipeline: "perp_orderbook_pipeline"
    caller_config:
      datasource_id: "binance.futures.ws"
      rate_limit:
        capacity: 80
        refill_rate: 30
      backfill:
        http:
          enabled: true
          transport: "rest"
          endpoint: "https://fapi.binance.com/fapi/v1/depth"
          method: "GET"
          datasource_id: "binance.futures.rest"
          query:
            symbol: "AAVEUSDT"
            limit: "500"
    caller_params:
      streams:
        - "aaveusdt@depth@100ms"
      heartbeat_ms: 15000
      reconnect:
        backoff_base_seconds: 1
        backoff_max_seconds: 30
      metadata_fields:
        symbol: "s"
        event_time: "E"
    queue: { size: 5000 }

  - role_id: "binance-perp-aave-aggtrades"
    datasource_id: "binance.futures.ws"
    template: "binance_perp_ws_stream"
    pipeline: "binance_perp_aggtrades_pipeline"
    caller_params:
      streams:
        - "aaveusdt@aggTrade"
      heartbeat_ms: 15000
      reconnect:
        backoff_base_seconds: 1
        backoff_max_seconds: 30
      metadata_fields:
        symbol: "s"
        event_time: "E"
        agg_trade_id: "a"
        first_trade_id: "f"
        last_trade_id: "l"
      static_metadata:
        symbol: "AAVEUSDT"
        exchange: "binance"
    queue: { size: 3000 }

  - role_id: "binance-perp-btc-mark-index"
    datasource_id: "binance.futures.ws"
    template: "binance_perp_ws_stream"
    pipeline: "binance_perp_mark_index_pipeline"
    caller_config:
      metadata:
        exchange: "BINANCE"
        channel: "mark_index"
        instrument: "perp"
    caller_params:
      subscribe: "btcusdt@markPrice@1s"
      static_metadata:
        symbol: "BTCUSDT"
    queue: { size: 2000 }

  - role_id: "binance-perp-btc-funding"
    datasource_id: "binance.spot.rest"
    template: "http_poll_native_call"
    pipeline: "binance_perp_funding_pipeline"
    polling_interval: 60
    caller_config:
      endpoint: "https://fapi.binance.com/fapi/v1/fundingRate"
      timeout_ms: 3000
      request:
        transport: "rest"
        method: "GET"
        query:
          symbol: "BTCUSDT"
          limit: "1"
      metadata:
        exchange: "BINANCE"
        channel: "funding_rate"
        instrument: "perp"
        symbol: "BTCUSDT"
    queue: { size: 1000 }

  - role_id: "binance-perp-btc-openinterest"
    datasource_id: "binance.spot.rest"
    template: "http_poll_native_call"
    pipeline: "binance_perp_open_interest_pipeline"
    polling_interval: 60
    caller_config:
      endpoint: "https://fapi.binance.com/futures/data/openInterestHist"
      timeout_ms: 3000
      request:
        transport: "rest"
        method: "GET"
        query:
          symbol: "BTCUSDT"
          period: "5m"
          limit: "1"
      metadata:
        exchange: "BINANCE"
        channel: "open_interest"
        instrument: "perp"
        symbol: "BTCUSDT"
    queue: { size: 1000 }

  - role_id: "binance-perp-btc-liquidations"
    datasource_id: "binance.futures.ws"
    template: "binance_perp_ws_stream"
    pipeline: "binance_perp_liquidations_pipeline"
    caller_params:
      streams:
        - "btcusdt@forceOrder"
    queue: { size: 2000 }

  - role_id: "hyperliquid-perp-orderbook"
    datasource_id: "hyperliquid.ws"
    template: "hyperliquid_ws_stream"
    pipeline: "hyperliquid_perp_orderbook_pipeline"
    caller_config:
      metadata:
        exchange: "HYPERLIQUID"
        channel: "orderbook"
        instrument: "perp"
    caller_params:
      subscribe_raw:
        - '{"method":"subscribe","subscription":{"type":"l2Book","coin":"BTC"}}'
      static_metadata:
        exchange: "HYPERLIQUID"
    queue: { size: 5000 }

  - role_id: "hyperliquid-perp-trades"
    datasource_id: "hyperliquid.ws"
    template: "hyperliquid_ws_stream"
    pipeline: "hyperliquid_perp_trades_pipeline"
    caller_config:
      metadata:
        exchange: "HYPERLIQUID"
        channel: "trades"
        instrument: "perp"
    caller_params:
      subscribe_raw:
        - '{"method":"subscribe","subscription":{"type":"trades","coin":"BTC"}}'
      static_metadata:
        exchange: "HYPERLIQUID"
    queue: { size: 3000 }

  - role_id: "hyperliquid-perp-asset-ctx"
    datasource_id: "hyperliquid.info.rest"
    template: "http_poll_native_call"
    pipeline: "hyperliquid_perp_asset_ctx_pipeline"
    polling_interval: 10
    caller_config:
      endpoint: "https://api.hyperliquid.xyz/info"
      timeout_ms: 4000
      request:
        transport: "rest"
        method: "POST"
        headers:
          Content-Type: "application/json"
        body: '{"type":"metaAndAssetCtxs"}'
      metadata:
        exchange: "HYPERLIQUID"
        channel: "asset_ctx"
        instrument: "perp"
    queue: { size: 2000 }

  # Metadata采集任务示例
  - role_id: "metadata-kafka"
    template: "metadata_polling"
    pipeline: "metadata_kafka_pipeline"
    polling_interval: 60
    caller: "metadata_kafka"
    caller_params:
      brokers:
        - "localhost:9092"
      cluster: "local-dev"
      domain: "kafka"
      include_internal: false
      fetch_offsets: false

  - role_id: "metadata-postgres"
    template: "metadata_polling"
    pipeline: "metadata_postgres_pipeline"
    polling_interval: 300
    caller: "metadata_postgres"
    caller_params:
      schemas: ["public"]
      cluster: "analytics-cluster"
      domain: "postgres"

  - role_id: "metadata-clickhouse"
    template: "metadata_polling"
    pipeline: "metadata_clickhouse_pipeline"
    polling_interval: 300
    caller: "metadata_clickhouse"
    caller_params:
      databases: ["default"]
      cluster: "ch-local"
      domain: "clickhouse"

  - role_id: "mockprovider-websocket"
    datasource_id: "mockprovider.ws"
    template: "mockprovider_ws_stream"
    pipeline: "evm_block_integrity_pipeline"
    caller_config:
      backfill:
        ws:
          enabled: true
          rpc_method: "eth_getBlockByNumber"
          include_full_tx: false
        http:
          enabled: true
          endpoint: "http://localhost:8090/eth"
          rpc_method: "eth_getBlockByNumber"
          include_full_tx: false
    caller_params:
      subscribe: "newHeads"
      heartbeat_ms: 30000
      poll_interval_ms: 500
    queue: { size: 5000 }

  - role_id: "mockprovider-http-backfill"
    datasource_id: "mockprovider.http"
    template: "kafka_command_native_call"
    pipeline: "evm_block_raw_pipeline"
    emitter_config:
      brokers: ["localhost:9092"]
      topic: "http.tasks"
      group_id: "worker.mockprovider.http"
    caller_config:
      endpoint: "http://localhost:8090"
      timeout_ms: 5000
      rate_limit:
        capacity: 2
        refill_rate: 0.1
      http_pool:
        max_conns: 50
        max_idle: 10
        idle_timeout_ms: 90000
        connect_timeout_ms: 10000
        request_timeout_ms: 30000
    queue: { size: 5000 }
