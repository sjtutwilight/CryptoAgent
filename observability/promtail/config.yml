server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ==================== Docker 容器日志采集 ====================
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_image]
        target_label: image
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - docker: {}
      # 为不同组件添加标签
      - match:
          selector: '{container=~"flink.*"}'
          stages:
            - labels:
                component: flink
      - match:
          selector: '{container=~".*kafka.*"}'
          stages:
            - labels:
                component: kafka
      - match:
          selector: '{container=~"clickhouse.*"}'
          stages:
            - labels:
                component: clickhouse
      - match:
          selector: '{container=~"obs-.*"}'
          stages:
            - labels:
                component: observability
      - match:
          selector: '{container=~".*worker.*"}'
          stages:
            - labels:
                component: worker
            - json:
                expressions:
                  ts: ts
                  level: level
                  event: event
                  service: service
                  role_id: role_id
                  error_class: error_class
                  backfill_type: backfill_type
                  session_key: session_key
                  cmd_id: cmd_id
                  trace_id: trace_id
                  message: message
            - timestamp:
                source: ts
                format: RFC3339Nano
            - labels:
                level:
                event:
                service:
                role_id:
                error_class:
                backfill_type:
  # ==================== Flink 应用日志 ====================
  - job_name: flink-logs
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?P<level>\w+)\s+(?P<logger>[\w.]+)\s+\[(?P<thread>[^\]]+)\]\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
          thread:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
    static_configs:
      - targets:
          - localhost
        labels:
          job: flink
          component: flink
          __path__: /var/log/app/runtime/flink/*.log

  # ==================== Worker 日志采集 ====================
  # Worker运行在宿主机时，需要挂载对应目录
  - job_name: worker-logs
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            event: event
            service: service
            role_id: role_id
            error_class: error_class
            backfill_type: backfill_type
            session_key: session_key
            cmd_id: cmd_id
            trace_id: trace_id
            message: message
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          level:
          event:
          service:
          role_id:
          error_class:
          backfill_type:
    static_configs:
      - targets:
          - localhost
        labels:
          job: worker
          component: worker
          service: datainjector
          __path__: /var/log/app/runtime/worker/*.log

  # ==================== Backend 日志采集 ====================
  # Spring Boot 日志格式
  - job_name: backend-logs
    pipeline_stages:
      # Spring Boot默认日志格式
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+\[(?P<thread>[^\]]+)\]\s+(?P<level>\w+)\s+(?P<logger>[\w.]+)\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
          thread:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'
      # 提取trace_id（如果有）
      - regex:
          expression: 'traceId=(?P<trace_id>\w+)'
          source: message
      - labels:
          trace_id:
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          component: backend
          service: twilight-backend
          __path__: /var/log/app/backend/*.log



  # ==================== 应用 JSON 格式日志 ====================
  - job_name: app-json-logs
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            thread: thread
            message: message
            timestamp: timestamp
            trace_id: trace_id
            span_id: span_id
            role_id: role_id
            datasource_id: datasource_id
      - labels:
          level:
          trace_id:
          span_id:
          role_id:
          datasource_id:
      - timestamp:
          source: timestamp
          format: RFC3339
    static_configs:
      - targets:
          - localhost
        labels:
          job: application
          __path__: /var/log/app/*.json

  # ==================== Aggregator (Flink Jobs) 日志 ====================
  - job_name: aggregator-logs
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?P<level>\w+)\s+(?P<logger>[\w.]+)\s+\[(?P<thread>[^\]]+)\]\s+-\s+(?P<message>.*)$'
      - labels:
          level:
          logger:
          thread:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
    static_configs:
      - targets:
          - localhost
        labels:
          job: aggregator
          component: flink
          service: aggregator
          __path__: /var/log/app/aggregator/*.log

  # ==================== ClickHouse 日志 ====================
  - job_name: clickhouse-logs
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}\.\d{2}\.\d{2} \d{2}:\d{2}:\d{2}\.\d+) \[ (?P<thread_id>\d+) \] \{(?P<query_id>[^}]*)\} <(?P<level>\w+)> (?P<logger>[\w.]+): (?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: '2006.01.02 15:04:05.000000'
    static_configs:
      - targets:
          - localhost
        labels:
          job: clickhouse
          component: clickhouse
          __path__: /var/log/clickhouse-server/*.log
