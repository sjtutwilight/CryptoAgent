# DataPlatform 告警规则
# 覆盖 Kafka、Flink、ClickHouse、Worker、Backend 等关键组件

groups:
  # ==================== Kafka 告警 ====================
  - name: kafka_alerts
    rules:
      # Consumer Lag 告警
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 10000
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Kafka消费者延迟过高"
          description: "消费组 {{ $labels.consumergroup }} 在topic {{ $labels.topic }} 上的lag为 {{ $value }}，超过10000条"

      - alert: KafkaConsumerLagCritical
        expr: kafka_consumergroup_lag > 100000
        for: 2m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka消费者延迟严重"
          description: "消费组 {{ $labels.consumergroup }} 在topic {{ $labels.topic }} 上的lag为 {{ $value }}，超过100000条"

      # Topic 分区 Under-replicated
      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_topic_partition_under_replicated_partition > 0
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Kafka分区副本不足"
          description: "Topic {{ $labels.topic }} 存在under-replicated分区"

      # Broker 离线
      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka Broker离线"
          description: "可用Broker数量为 {{ $value }}"

  # ==================== Flink 告警 ====================
  - name: flink_alerts
    rules:
      # Checkpoint 失败
      - alert: FlinkCheckpointFailed
        expr: increase(flink_jobmanager_job_numberOfFailedCheckpoints[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: flink
        annotations:
          summary: "Flink Checkpoint失败"
          description: "Job {{ $labels.job_name }} 在过去5分钟内有 {{ $value }} 次checkpoint失败"

      # Checkpoint 持续时间过长
      - alert: FlinkCheckpointDurationHigh
        expr: flink_jobmanager_job_lastCheckpointDuration > 60000
        for: 5m
        labels:
          severity: warning
          component: flink
        annotations:
          summary: "Flink Checkpoint耗时过长"
          description: "Job {{ $labels.job_name }} 的checkpoint耗时 {{ $value }}ms，超过60秒"

      # TaskManager 内存使用过高
      - alert: FlinkTaskManagerMemoryHigh
        expr: flink_taskmanager_Status_JVM_Memory_Heap_Used / flink_taskmanager_Status_JVM_Memory_Heap_Max > 0.9
        for: 5m
        labels:
          severity: warning
          component: flink
        annotations:
          summary: "Flink TaskManager内存使用过高"
          description: "TaskManager {{ $labels.tm_id }} 堆内存使用率超过90%"

      # Job 重启次数过多
      - alert: FlinkJobRestartsTooMany
        expr: increase(flink_jobmanager_job_numRestarts[1h]) > 5
        for: 1m
        labels:
          severity: warning
          component: flink
        annotations:
          summary: "Flink Job重启次数过多"
          description: "Job {{ $labels.job_name }} 在过去1小时内重启了 {{ $value }} 次"

      # 背压检测
      - alert: FlinkBackpressureHigh
        expr: flink_taskmanager_job_task_backPressuredTimeMsPerSecond > 500
        for: 5m
        labels:
          severity: warning
          component: flink
        annotations:
          summary: "Flink任务背压过高"
          description: "Task {{ $labels.task_name }} 背压时间 {{ $value }}ms/s"

  # ==================== ClickHouse 告警 ====================
  - name: clickhouse_alerts
    rules:
      # 写入延迟过高
      - alert: ClickHouseInsertLatencyHigh
        expr: ClickHouseProfileEvents_InsertedRows / ClickHouseProfileEvents_InsertQuery > 0 and ClickHouseProfileEvents_InsertQueryTimeMicroseconds / ClickHouseProfileEvents_InsertQuery / 1000 > 1000
        for: 5m
        labels:
          severity: warning
          component: clickhouse
        annotations:
          summary: "ClickHouse写入延迟过高"
          description: "ClickHouse平均写入延迟超过1秒"

      # Merge队列积压
      - alert: ClickHouseMergeBacklog
        expr: ClickHouseMetrics_BackgroundMergesInProgress > 10
        for: 10m
        labels:
          severity: warning
          component: clickhouse
        annotations:
          summary: "ClickHouse Merge队列积压"
          description: "当前有 {{ $value }} 个后台Merge任务在运行"

      # 内存使用过高
      - alert: ClickHouseMemoryHigh
        expr: ClickHouseMetrics_MemoryTracking / 1024 / 1024 / 1024 > 8
        for: 5m
        labels:
          severity: warning
          component: clickhouse
        annotations:
          summary: "ClickHouse内存使用过高"
          description: "ClickHouse内存使用 {{ $value }}GB"

      # 查询数过多
      - alert: ClickHouseQueriesHigh
        expr: rate(ClickHouseProfileEvents_Query[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: clickhouse
        annotations:
          summary: "ClickHouse查询QPS过高"
          description: "ClickHouse查询QPS为 {{ $value }}"

      # 连接数过多
      - alert: ClickHouseConnectionsHigh
        expr: ClickHouseMetrics_TCPConnection > 100
        for: 5m
        labels:
          severity: warning
          component: clickhouse
        annotations:
          summary: "ClickHouse连接数过多"
          description: "当前TCP连接数为 {{ $value }}"

  # ==================== Worker 告警 ====================
  - name: worker_alerts
    rules:
      # Worker 离线
      - alert: WorkerDown
        expr: max(up{job="worker"}) < 1
        for: 2m
        labels:
          severity: critical
          component: worker
          root_cause_class: scrape_unavailable
          error_class: target_down
        annotations:
          summary: "Worker服务离线"
          description: "job=worker 在过去2分钟内没有可用抓取目标"
          root_cause_class: "scrape_unavailable"
          error_class: "target_down"

      # Backfill pending 时长异常（会话卡滞）
      - alert: WorkerBackfillSessionPendingTooLong
        expr: histogram_quantile(0.95, sum by (le, role_id, backfill_type) (rate(worker_integrity_backfill_pending_duration_seconds_bucket[10m]))) > 30
        for: 5m
        labels:
          severity: warning
          component: worker
          root_cause_class: backfill_session_stuck
          error_class: pending_timeout
        annotations:
          summary: "Worker Backfill pending 时长异常"
          description: "Role {{ $labels.role_id }} {{ $labels.backfill_type }} pending p95 超过 30s"
          root_cause_class: "backfill_session_stuck"
          error_class: "pending_timeout"

      # Backfill inflight 卡住（有 inflight，但长期无结果回写）
      - alert: WorkerBackfillInflightStuck
        expr: sum by (role_id, backfill_type) (max_over_time(worker_integrity_backfill_sessions_inflight[15m])) > 0 and sum by (role_id, backfill_type) (increase(worker_integrity_backfill_result_total[15m])) == 0
        for: 5m
        labels:
          severity: critical
          component: worker
          root_cause_class: backfill_session_stuck
          error_class: inflight_timeout
        annotations:
          summary: "Worker Backfill inflight 长时间未结束"
          description: "Role {{ $labels.role_id }} {{ $labels.backfill_type }} 在 15m 内有 inflight，但无结果回写"
          root_cause_class: "backfill_session_stuck"
          error_class: "inflight_timeout"

      # Backfill fail/timeout 激增
      - alert: WorkerBackfillResultFailureBurst
        expr: sum by (role_id, backfill_type, error_class) (increase(worker_integrity_backfill_result_total{status=~"fail|timeout"}[10m])) > 5
        for: 2m
        labels:
          severity: critical
          component: worker
          root_cause_class: backfill_degradation
          error_class: backfill_result_burst
        annotations:
          summary: "Worker Backfill fail/timeout 激增"
          description: "Role {{ $labels.role_id }} {{ $labels.backfill_type }} 在 10m 内 fail/timeout 达到 {{ $value }}"
          root_cause_class: "backfill_degradation"
          error_class: "{{ $labels.error_class }}"

      # Backfill dedup 异常激增
      - alert: WorkerBackfillDedupBurst
        expr: sum by (role_id, backfill_type) (increase(worker_integrity_backfill_schedule_dedup_total[10m])) > 50
        for: 5m
        labels:
          severity: warning
          component: worker
          root_cause_class: duplicate_schedule
          error_class: dedup_spike
        annotations:
          summary: "Worker Backfill dedup 命中激增"
          description: "Role {{ $labels.role_id }} {{ $labels.backfill_type }} 在 10m 内 dedup 命中 {{ $value }}"
          root_cause_class: "duplicate_schedule"
          error_class: "dedup_spike"

      # Backfill 持久化补偿积压过高
      - alert: WorkerBackfillCompensationBacklogHigh
        expr: max_over_time(worker_integrity_backfill_compensation_backlog[10m]) > 100
        for: 5m
        labels:
          severity: warning
          component: worker
          root_cause_class: backlog
          error_class: compensation_backlog
        annotations:
          summary: "Worker Backfill 补偿积压过高"
          description: "Role {{ $labels.role_id }} 持久化补偿队列积压超过 100"
          root_cause_class: "backlog"
          error_class: "compensation_backlog"

      # Pipeline 产出率下降（caller -> sink）
      - alert: WorkerPipelineYieldDegraded
        expr: (sum by (role_id) (increase(worker_task_stage_total{stage="final_succeeded"}[10m])) / clamp_min(sum by (role_id) (increase(worker_task_stage_total{stage="caller_accepted"}[10m])), 1)) < 0.6 and sum by (role_id) (increase(worker_task_stage_total{stage="caller_accepted"}[10m])) > 20
        for: 5m
        labels:
          severity: warning
          component: worker
          root_cause_class: pipeline_yield
          error_class: sink_success_drop
        annotations:
          summary: "Worker Pipeline 产出率下降"
          description: "Role {{ $labels.role_id }} 在 10m 窗口 caller->sink 产出率低于 60%"
          root_cause_class: "pipeline_yield"
          error_class: "sink_success_drop"

      # WebSocket 重连频率过高（链路抖动）
      - alert: WorkerWSReconnectBurst
        expr: increase(worker_websocket_reconnects_total[10m]) > 20
        for: 2m
        labels:
          severity: warning
          component: worker
          root_cause_class: link_jitter
          error_class: reconnect_burst
        annotations:
          summary: "Worker WebSocket重连频率过高"
          description: "Role {{ $labels.role_id }} 在10分钟内重连 {{ $value }} 次，疑似链路抖动"
          root_cause_class: "link_jitter"
          error_class: "reconnect_burst"

      # WebSocket 丢弃激增（消费背压）
      - alert: WorkerWSBufferDropHigh
        expr: sum by (role_id, layer, reason) (increase(worker_websocket_drops_total[5m])) > 200
        for: 2m
        labels:
          severity: warning
          component: worker
          root_cause_class: backpressure
          error_class: ws_drop_burst
        annotations:
          summary: "Worker WebSocket丢弃激增"
          description: "Role {{ $labels.role_id }} 在5分钟内丢弃 {{ $value }} 条消息（{{ $labels.layer }}/{{ $labels.reason }}）"
          root_cause_class: "backpressure"
          error_class: "ws_drop_burst"

      # WS 1008/限流风险（策略限流）
      - alert: WorkerWSPolicyViolationBurst
        expr: increase(worker_websocket_errors_total{error_type="policy_1008"}[10m]) > 5
        for: 2m
        labels:
          severity: warning
          component: worker
          root_cause_class: rate_limit
          error_class: policy_1008
        annotations:
          summary: "Worker WebSocket策略违规频发"
          description: "Role {{ $labels.role_id }} 在10分钟内命中 {{ $value }} 次 1008/policy violation，疑似限流"
          root_cause_class: "rate_limit"
          error_class: "policy_1008"
  # ==================== Backend 告警 ====================
  - name: backend_alerts
    rules:
      # Backend 离线
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend服务离线"
          description: "Backend实例 {{ $labels.instance }} 无法访问"

      # API 响应时间过长
      - alert: BackendLatencyHigh
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="backend"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Backend API响应时间过长"
          description: "Backend P95响应时间超过2秒"

      # API 错误率过高
      - alert: BackendErrorRateHigh
        expr: rate(http_server_requests_seconds_count{job="backend",status=~"5.."}[5m]) / rate(http_server_requests_seconds_count{job="backend"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Backend API错误率过高"
          description: "Backend 5xx错误率超过5%"

      # JVM 堆内存使用过高
      - alert: BackendHeapMemoryHigh
        expr: jvm_memory_used_bytes{job="backend",area="heap"} / jvm_memory_max_bytes{job="backend",area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Backend JVM堆内存使用过高"
          description: "Backend堆内存使用率超过85%"

      # GC 时间过长
      - alert: BackendGCTimeHigh
        expr: rate(jvm_gc_pause_seconds_sum{job="backend"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Backend GC时间过长"
          description: "Backend GC暂停时间超过500ms/s"

      # 数据库连接池耗尽
      - alert: BackendDBConnectionPoolExhausted
        expr: hikaricp_connections_active{job="backend"} / hikaricp_connections_max{job="backend"} > 0.9
        for: 5m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: "Backend数据库连接池接近耗尽"
          description: "连接池 {{ $labels.pool }} 使用率超过90%"

  # ==================== 通用基础设施告警 ====================
  - name: infrastructure_alerts
    rules:
      # 磁盘空间不足
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "磁盘空间不足"
          description: "{{ $labels.mountpoint }} 可用空间低于10%"

      # CPU 使用率过高
      - alert: CPUUsageHigh
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "CPU使用率过高"
          description: "实例 {{ $labels.instance }} CPU使用率超过85%"

      # 内存使用率过高
      - alert: MemoryUsageHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "内存使用率过高"
          description: "实例 {{ $labels.instance }} 内存使用率超过90%"

  # ==================== Codex OTel 告警 ====================
  - name: codex_otel_alerts
    rules:
      # OTel 导出失败：Collector 到 Loki/Tempo 的日志发送失败
      - alert: CodexOTLPExportFailed
        expr: increase(otelcol_exporter_send_failed_log_records{job="otel-collector"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          component: codex-otel
        annotations:
          summary: "Codex OTel 日志导出失败"
          description: "过去 5 分钟 Collector 检测到日志导出失败，失败条数 {{ $value }}"

      # tool_error 突增：由分析流程产出的聚合指标
      - alert: CodexToolErrorBurst
        expr: increase(codex_tool_error_total[10m]) > 20
        for: 2m
        labels:
          severity: warning
          component: codex-otel
        annotations:
          summary: "Codex tool_error 突增"
          description: "过去 10 分钟 tool_error 增量 {{ $value }}，请检查失败热点"

      # 长时无产出会话：由分析流程输出的会话延迟指标
      - alert: CodexSessionNoOutputTooLong
        expr: max_over_time(codex_session_no_output_duration_seconds[15m]) > 600
        for: 5m
        labels:
          severity: warning
          component: codex-otel
        annotations:
          summary: "Codex 会话长时无产出"
          description: "会话首个有效产出时延超过 10 分钟，当前值 {{ $value }} 秒"











