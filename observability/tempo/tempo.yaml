server:
  http_listen_port: 3200
  grpc_listen_port: 9095

# 分发器接收来自 OTel Collector 的 OTLP trace 数据
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # 控制 block 切分频率，兼顾写入与查询效率
  max_block_duration: 5m

compactor:
  compaction:
    compaction_window: 1h
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
