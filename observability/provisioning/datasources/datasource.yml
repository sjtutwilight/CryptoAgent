apiVersion: 1

datasources:
  # Prometheus - 指标数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://obs-prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  # Loki - 日志数据源
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://obs-loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        # 从日志中提取 trace_id 并链接到 Tempo (如果启用)
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
