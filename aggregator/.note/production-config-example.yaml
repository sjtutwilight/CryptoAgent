# Flink聚合器生产环境配置示例
# 适用场景: 100万events/分钟 (16,667 events/s)
# 资源配置: 16台TaskManager，每台8核16GB

# ============================================
# 1. Flink集群配置
# ============================================
jobmanager.memory.process.size: 4g
jobmanager.memory.flink.size: 3g
jobmanager.memory.jvm-overhead.max: 1g
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123
jobmanager.bind-host: 0.0.0.0

# TaskManager配置
taskmanager.numberOfTaskSlots: 4  # 每台4个Slot
taskmanager.memory.process.size: 16g
taskmanager.memory.flink.size: 12g
taskmanager.memory.jvm-overhead.max: 4g
taskmanager.memory.managed.fraction: 0.4  # RocksDB使用40%
taskmanager.memory.network.fraction: 0.2  # 网络缓冲20%

# 网络优化
taskmanager.network.memory.min: 512mb
taskmanager.network.memory.max: 4gb
taskmanager.network.memory.buffers-per-channel: 16  # 默认2，提升吞吐
taskmanager.network.memory.floating-buffers-per-gate: 16

# 并行度配置
parallelism.default: 16  # 与Kafka分区数一致
taskmanager.cluster.evenly-spread-out-slots: true

# ============================================
# 2. Checkpoint与状态后端
# ============================================
# Checkpoint基础配置
execution.checkpointing.mode: EXACTLY_ONCE
execution.checkpointing.interval: 30s
execution.checkpointing.timeout: 5min
execution.checkpointing.min-pause: 10s
execution.checkpointing.max-concurrent-checkpoints: 1

# 外部化Checkpoint
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
execution.checkpointing.checkpoints-directory: s3://flink-checkpoints/aggregator/

# RocksDB状态后端
state.backend: rocksdb
state.backend.incremental: true  # 增量Checkpoint，减少时间和空间
state.checkpoints.dir: s3://flink-checkpoints/aggregator/checkpoints
state.savepoints.dir: s3://flink-checkpoints/aggregator/savepoints

# RocksDB调优
state.backend.rocksdb.predefined-options: SPINNING_DISK_OPTIMIZED  # 或FLASH_SSD_OPTIMIZED
state.backend.rocksdb.checkpoint.transfer.thread.num: 4
state.backend.rocksdb.localdir: /data/rocksdb
state.backend.rocksdb.writebuffer.size: 64mb
state.backend.rocksdb.writebuffer.count: 3
state.backend.rocksdb.block.cache-size: 256mb

# ============================================
# 3. Kafka Source配置
# ============================================
# Kafka连接
kafka.bootstrap.servers: kafka-broker1:9092,kafka-broker2:9092,kafka-broker3:9092
kafka.topic: dex_transaction
kafka.group.id: flink-aggregator-group

# Kafka消费者配置
kafka.consumer.fetch.min.bytes: 1048576  # 1MB最小拉取
kafka.consumer.fetch.max.wait.ms: 500
kafka.consumer.max.poll.records: 1000
kafka.consumer.session.timeout.ms: 30000
kafka.consumer.heartbeat.interval.ms: 10000
kafka.consumer.max.partition.fetch.bytes: 2097152  # 2MB

# Kafka安全配置（如需要）
# kafka.security.protocol: SASL_SSL
# kafka.sasl.mechanism: PLAIN
# kafka.ssl.truststore.location: /etc/kafka/truststore.jks

# ============================================
# 4. ClickHouse Sink配置
# ============================================
clickhouse.url: jdbc:clickhouse://clickhouse-cluster:8123/default
clickhouse.username: default
clickhouse.password: ${CLICKHOUSE_PASSWORD}  # 从环境变量读取
clickhouse.socket.timeout: 300000  # 5分钟
clickhouse.connection.timeout: 30000  # 30秒

# 批量写入配置
clickhouse.batch.size: 200  # 200条批量写入
clickhouse.batch.interval.ms: 10000  # 10秒最大等待
clickhouse.max.retries: 3
clickhouse.retry.interval.ms: 1000

# 连接池配置
clickhouse.pool.size: 10
clickhouse.pool.max-idle: 5
clickhouse.pool.min-idle: 2

# ============================================
# 5. Redis配置
# ============================================
# 元数据Redis（同步访问）
redis.metadata.host: redis-metadata
redis.metadata.port: 6379
redis.metadata.password: ${REDIS_METADATA_PASSWORD}
redis.metadata.database: 0
redis.metadata.timeout: 5000  # 5秒超时

# Token价格Redis（广播）
redis.metrics.host: redis-metrics
redis.metrics.port: 6379
redis.metrics.password: ${REDIS_METRICS_PASSWORD}
redis.metrics.database: 1
redis.metrics.refresh.interval.ms: 30000  # 30秒刷新

# Redis连接池
redis.pool.max-total: 16
redis.pool.max-idle: 8
redis.pool.min-idle: 2
redis.pool.max-wait-millis: 3000

# ============================================
# 6. 性能调优参数
# ============================================
# 缓冲超时（批量发送）
execution.buffer-timeout: 100ms

# 对象重用（减少GC）
pipeline.object-reuse: true

# 延迟追踪
metrics.latency.interval: 10000
metrics.latency.granularity: operator

# ============================================
# 7. 资源管理
# ============================================
# Slot共享组
slotSharingGroup.default: default
slotSharingGroup.source: kafka-source
slotSharingGroup.sink: clickhouse-sink

# 资源限制
taskmanager.memory.task.heap.size: 6g
taskmanager.memory.task.off-heap.size: 2g

# ============================================
# 8. 容错与恢复
# ============================================
# 重启策略
restart-strategy: fixed-delay
restart-strategy.fixed-delay.attempts: 3
restart-strategy.fixed-delay.delay: 10s

# 或使用失败率重启策略
# restart-strategy: failure-rate
# restart-strategy.failure-rate.max-failures-per-interval: 3
# restart-strategy.failure-rate.failure-rate-interval: 5min
# restart-strategy.failure-rate.delay: 10s

# ============================================
# 9. 高可用配置
# ============================================
# Zookeeper HA
high-availability: zookeeper
high-availability.zookeeper.quorum: zk1:2181,zk2:2181,zk3:2181
high-availability.zookeeper.path.root: /flink
high-availability.cluster-id: /aggregator-cluster
high-availability.storageDir: s3://flink-ha/recovery

# JobManager HA
jobmanager.execution.failover-strategy: region

# ============================================
# 10. 监控与指标
# ============================================
# Metrics Reporter
metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
metrics.reporter.prom.port: 9249
metrics.reporter.prom.interval: 10 SECONDS

# 自定义指标
metrics.scope.jm: <host>.jobmanager
metrics.scope.jm.job: <host>.jobmanager.<job_name>
metrics.scope.tm: <host>.taskmanager.<tm_id>
metrics.scope.tm.job: <host>.taskmanager.<tm_id>.<job_name>
metrics.scope.task: <host>.taskmanager.<tm_id>.<job_name>.<operator_name>.<subtask_index>

# 历史服务器
jobmanager.archive.fs.dir: s3://flink-history/
historyserver.web.address: 0.0.0.0
historyserver.web.port: 8082
historyserver.archive.fs.dir: s3://flink-history/
historyserver.archive.fs.refresh-interval: 10000

# ============================================
# 11. 安全配置
# ============================================
# SSL配置（如需要）
# security.ssl.enabled: true
# security.ssl.keystore: /path/to/keystore.jks
# security.ssl.keystore-password: ${SSL_KEYSTORE_PASSWORD}
# security.ssl.truststore: /path/to/truststore.jks
# security.ssl.truststore-password: ${SSL_TRUSTSTORE_PASSWORD}

# Kerberos配置（如需要）
# security.kerberos.login.use-ticket-cache: false
# security.kerberos.login.keytab: /path/to/keytab
# security.kerberos.login.principal: flink@REALM

# ============================================
# 12. 日志配置
# ============================================
# 日志级别
rootLogger.level: INFO
logger.flink.name: org.apache.flink
logger.flink.level: INFO
logger.aggregator.name: com.twilight.aggregator
logger.aggregator.level: DEBUG

# 日志文件
log.file: /var/log/flink/aggregator.log
log.file.max-size: 100MB
log.file.max-backup: 10

# ============================================
# 13. JVM参数（通过env.java.opts配置）
# ============================================
# env.java.opts: >
#   -XX:+UseG1GC
#   -XX:MaxGCPauseMillis=200
#   -XX:G1HeapRegionSize=32m
#   -XX:+ParallelRefProcEnabled
#   -XX:+PrintGCDetails
#   -XX:+PrintGCDateStamps
#   -Xloggc:/var/log/flink/gc.log
#   -XX:+UseGCLogFileRotation
#   -XX:NumberOfGCLogFiles=10
#   -XX:GCLogFileSize=100M

# ============================================
# 14. 业务自定义配置
# ============================================
# UnifiedFilterOperator配置
filter.swap.enabled: true
filter.transfer.enabled: true
filter.mint.enabled: true
filter.burn.enabled: true
filter.approval.blocked: true

# EventEnrichmentMap配置
enrichment.cache.initial-size: 16384
enrichment.cache.load-factor: 0.75
enrichment.cache.concurrency-level: 16

# TokenMetricsBroadcaster配置
metrics.broadcast.ttl.hours: 24
metrics.broadcast.max-tokens: 10000

# PnL算法配置
pnl.precision.scale: 18
pnl.prevent-oversell: true

# 窗口配置
window.base.size.seconds: 20
window.allowed-lateness.seconds: 10

# ============================================
# 15. 环境特定配置覆盖
# ============================================
# 开发环境
# execution.checkpointing.interval: 60s  # 更长间隔
# parallelism.default: 2

# 测试环境
# execution.checkpointing.interval: 30s
# parallelism.default: 4

# 生产环境（当前配置）
# execution.checkpointing.interval: 30s
# parallelism.default: 16

# ============================================
# 配置优先级说明
# ============================================
# 1. 命令行参数 > 2. Job代码中的配置 > 3. flink-conf.yaml > 4. 默认值
#
# 启动示例:
# flink run \
#   -c com.twilight.aggregator.TradeFactJob \
#   -p 16 \
#   -s s3://flink-checkpoints/aggregator/savepoints/latest \
#   /path/to/aggregator.jar

# ============================================
# 资源估算公式
# ============================================
# TaskManager数量 = ceil(并行度 / slots-per-tm)
#                = ceil(16 / 4) = 4台
#
# 但考虑容错和负载均衡，建议:
# TaskManager数量 = 并行度 = 16台（每台1个Slot）
# 或 = 8台（每台2个Slot）
# 或 = 4台（每台4个Slot）
#
# 内存需求 = 16台 × 16GB = 256GB总内存
# CPU需求 = 16台 × 8核 = 128核
# 网络带宽 = 16台 × 1Gbps = 16Gbps

# ============================================
# 性能基准参考
# ============================================
# 吞吐量: 16,000 events/s (100万/分钟)
# 延迟P99: < 3秒 (端到端)
# Checkpoint时间: < 60秒
# 状态大小: ~10GB (PnL状态)
# CPU使用率: 40-60%
# 内存使用率: 60-80%
# 网络带宽: 2-4Gbps
# Kafka Lag: < 10,000条

# ============================================
# 告警阈值建议
# ============================================
# - Checkpoint失败率 > 10%
# - P99延迟 > 5秒
# - 背压比例 > 50%
# - Kafka Lag > 100,000条
# - CPU使用率 > 80%
# - 内存使用率 > 90%
# - GC时间占比 > 10%
# - TaskManager失联 > 1个



