# Default configuration for realtime dex swap pipeline
pipeline.environment=dev

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.group.id=realtime-pipeline

# Topics
kafka.topic.ods.swap.full.eth=ods_dex_swap_full_eth
kafka.topic.ods.swap.full.arb=ods_dex_swap_full_arb
kafka.topic.dim.token.price=dim_token_price_current
kafka.topic.dwd.swap=dwd_dex_swap

# Redis (account tag lookup)
redis.host=localhost
redis.port=6379
redis.database=0
redis.password=
redis.timeout.ms=2000
redis.cache.max.size=200000
redis.cache.ttl.seconds=300

# Job level knobs
pipeline.parallelism=4
pipeline.checkpoint.interval.ms=60000
pipeline.min.pause.between.checkpoints.ms=30000
pipeline.state.ttl.minutes=10
pipeline.watermark.max.out_of_orderness.seconds=15
pipeline.chain.id=1
pipeline.native.token.address=0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee

# Price lookup
price.lookup.max.age.seconds=30
