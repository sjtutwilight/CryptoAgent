spring:
  application:
    name: twilight-backend
  
  # 数据源配置
  datasource:
    # 主数据源 - ClickHouse
    url: jdbc:clickhouse://localhost:8123/default?compress=0&auto_discovery=false
    username: default
    password: 
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ClickHousePool
    
    # 自定义数据源配置
    clickhouse:
      jdbc-url: jdbc:clickhouse://localhost:8123/default?compress=0&auto_discovery=false
      username: default
      password: 
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        pool-name: ClickHousePool
    
    # PostgreSQL元数据源
    postgresql:
      jdbc-url: jdbc:postgresql://localhost:5432/twilight
      username: twilight
      password: twilight123
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        pool-name: PostgreSQLPool

  # Jackson JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# 服务器配置
server:
  port: 8088
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# 日志配置
logging:
  level:
    com.twilight.backend: INFO
    com.twilight.backend.aspect: INFO
    org.springframework.jdbc.core: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    path: logs
    name: logs/twilight-backend.log

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 5s

# SpringDoc API文档配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: Twilight数据平台API
    description: Twilight数据平台Web后端API文档
    version: 1.0.0
    contact:
      name: Twilight Team
      email: dev@twilight.com

# 应用自定义配置
twilight:
  # 随机值生成配置
  random:
    age:
      min: 30
      max: 3650  # 30天到10年
    security-score:
      min: 1
      max: 100
  
  # 查询配置
  query:
    default-page-size: 20
    max-page-size: 100
    default-time-range: 24h
  
  # 缓存配置
  cache:
    token-info-ttl: 3600  # 代币信息缓存1小时
    metrics-ttl: 300      # 指标缓存5分钟
