services:
  # Zookeeper服务
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: crypto-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crypto-network
    profiles: ["ingest"]

  # Kafka服务
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: crypto-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: on-failure:3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - crypto-network
    profiles: ["ingest"]
  # Kafka UI服务
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: crypto-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: crypto-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - crypto-network
    profiles: ["ingest"]
  # Redis服务
  redis:
    image: redis:7.2
    container_name: crypto-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - redis-data:/data
    networks:
      - crypto-network
    profiles: ["ingest"]
  # Redis Commander - Redis管理界面
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: crypto-redis-commander
    ports:
      - "8082:8081"
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - crypto-network
    profiles: ["ingest"]
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: twilight
      POSTGRES_PASSWORD: twilight123
      POSTGRES_DB: twilight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./runtime/scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twilight"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["ingest"]
  init-db:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: twilight
      POSTGRES_PASSWORD: twilight123
      TEST_ENV: "true"
    volumes:
      - ./runtime/scripts:/scripts
    command: ["/scripts/init.sh"]
    profiles: ["ingest"]

  # Flink 1.20 + Java 17 stack (with Paimon/StarRocks integration)
  jobmanager:
    image: flink:1.20-scala_2.12-java17
    container_name: flink-jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081" # Flink Web UI
    command: >
      bash -c "
        cp /opt/flink/custom-lib/*.jar /opt/flink/lib/ 2>/dev/null || true &&
        /docker-entrypoint.sh jobmanager
      "
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 1
        rest.bind-address: 0.0.0.0
        web.submit.enable: true
        # Paimon related
        table.exec.source.idle-timeout: 30s
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    volumes:
      - ./config/config.yaml:/opt/flink/conf/config.yaml
      - ./runtime/lib:/opt/flink/custom-lib
      - ./runtime/sql:/opt/flink/sql
      - ./runtime/data:/opt/flink/data
      - ./runtime/logs:/opt/flink/log
      - ./runtime/checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./runtime/paimon-warehouse:/opt/flink/data/paimon-warehouse
    networks:
      - flink-network
      - crypto-network
    profiles: ["flink"]

  taskmanager:
    image: flink:1.20-scala_2.12-java17
    hostname: taskmanager
    depends_on:
      - jobmanager
    command: >
      bash -c "
        cp /opt/flink/custom-lib/*.jar /opt/flink/lib/ 2>/dev/null || true &&
        /docker-entrypoint.sh taskmanager
      "
    scale: 3
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 4
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    volumes:
      - ./config/config.yaml:/opt/flink/conf/config.yaml
      - ./runtime/lib:/opt/flink/custom-lib
      - ./runtime/sql:/opt/flink/sql
      - ./runtime/data:/opt/flink/data
      - ./runtime/logs:/opt/flink/log
      - ./runtime/checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./runtime/paimon-warehouse:/opt/flink/data/paimon-warehouse
    networks:
      - flink-network
      - crypto-network
    profiles: ["flink"]

  sql-client:
    image: flink:1.20-scala_2.12-java17
    container_name: flink-sql-client
    hostname: sql-client
    depends_on:
      - jobmanager
      - taskmanager
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    volumes:
      - ./config/config.yaml:/opt/flink/conf/config.yaml
      - ./runtime/lib:/opt/flink/custom-lib
      - ./runtime/sql:/opt/flink/sql
      - ./runtime/data:/opt/flink/data
      - ./runtime/scripts:/opt/flink/scripts
      - ./runtime/paimon-warehouse:/opt/flink/data/paimon-warehouse
    networks:
      - flink-network
      - crypto-network
    profiles: ["flink"]
    command: >
      sh -c "
        cp /opt/flink/custom-lib/*.jar /opt/flink/lib/ 2>/dev/null || true &&
        echo 'Flink SQL Client已就绪' &&
        echo '使用以下命令进入SQL Client:' &&
        echo 'docker exec -it flink-sql-client ./bin/sql-client.sh' &&
        echo '或者运行预定义的SQL脚本:' &&
        echo 'docker exec -it flink-sql-client ./bin/sql-client.sh -f /opt/flink/sql/crypto.sql' &&
        tail -f /dev/null
      "

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      flink-network:
        ipv4_address: 172.28.0.100
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["flink"]

  minio-mc:
    image: minio/mc:latest
    container_name: minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set myminio http://minio:9000 admin password123 >/dev/null 2>&1; do
          sleep 0.5
        done

        # 确保可以访问和列出
        mc ls myminio >/dev/null 2>&1 || exit 1

        # 创建必要的bucket
        mc mb myminio/paimon-warehouse --ignore-existing
        mc mb myminio/flink-checkpoints --ignore-existing
        mc mb myminio/starrocks --ignore-existing

        # 为StarRocks创建专用的service account
        mc admin user svcacct add --access-key AAAAAAAAAAAAAAAAAAAA \
          --secret-key BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB \
          myminio \
          admin

        echo 'MinIO初始化完成：buckets和service account已创建'
        exit 0

    networks:
      - flink-network
    profiles: ["flink"]

  # StarRocks all-in-one
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: starrocks-allin1
    hostname: starrocks-allin1
    ports:
      - "9030:9030" # FE MySQL
      - "8030:8030" # FE HTTP
      - "9020:9020" # FE RPC
      - "9010:9010" # FE edit log
      - "8040:8040" # BE HTTP
      - "9060:9060" # BE
      - "9050:9050" # BE heartbeat
      - "8060:8060" # BE BRPC
      - "9080:8080" # extra HTTP
    environment:
      - JAVA_OPTS=-Xmx2g
      - SR_RUN_MODE=shared_data
      - SR_CLOUD_NATIVE_STORAGE_TYPE=S3
      - SR_AWS_S3_ENDPOINT=minio:9000
      - SR_AWS_S3_PATH=starrocks
      - SR_AWS_S3_ACCESS_KEY=AAAAAAAAAAAAAAAAAAAA
      - SR_AWS_S3_SECRET_KEY=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
      - SR_AWS_S3_USE_HTTPS=false
      - SR_AWS_S3_REGION=us-east-1
    depends_on:
      minio-mc:
        condition: service_completed_successfully
    volumes:
      - ./runtime/data/starrocks/fe:/opt/starrocks/fe/meta
      - ./runtime/data/starrocks/be:/opt/starrocks/be/storage
      - ./runtime/logs/starrocks:/opt/starrocks/fe/log
    networks:
      - flink-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW DATABASES;' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles: ["flink"]

  mysql-client:
    image: mysql:8.0
    container_name: starrocks-mysql-client
    networks:
      - flink-network
    depends_on:
      starrocks:
        condition: service_healthy
    volumes:
      - ./runtime/scripts:/scripts
    command: >
      sh -c "
        echo 'StarRocks MySQL客户端已就绪' &&
        echo '使用以下命令连接StarRocks:' &&
        echo 'mysql -h starrocks-allin1 -P 9030 -uroot' &&
        tail -f /dev/null
      "
    profiles: ["flink"]

  # ClickHouse OLAP database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9002:9000" # Native client
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./runtime/scripts/clickhouse/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - flink-network
      - crypto-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ulimits:
      nofile: 262144
    profiles: ["flink"]
  # 数据卷
volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local
  flink-savepoints:
    driver: local
  minio-data:
    driver: local
  clickhouse-data:
    driver: local

# 网络配置
networks:
  crypto-network:
    driver: bridge
  flink-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
