  # ==================== OLAP 数据库 ====================

  # ClickHouse OLAP database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9002:9000" # Native client
      - "9363:9363" # Prometheus metrics
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./runtime/batch/scripts/clickhouse/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./observability/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ulimits:
      nofile: 262144

  # ==================== 可观测性组件 ====================

  # Prometheus - 指标采集和存储
  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - crypto-network

  # Loki - 日志聚合
  loki:
    image: grafana/loki:2.9.2
    container_name: obs-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - crypto-network

  # Grafana - 可视化面板
  grafana:
    image: grafana/grafana:latest
    container_name: obs-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/provisioning:/etc/grafana/provisioning
    networks:
      - crypto-network
    depends_on:
      - prometheus
      - loki

  # Promtail - 日志采集器
  promtail:
    image: grafana/promtail:2.9.2
    container_name: obs-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./runtime/logs:/var/log/app/runtime:ro
      - ./backend/logs:/var/log/app/backend:ro
      - ./aggregator/logs:/var/log/app/aggregator:ro
    networks:
      - crypto-network
    depends_on:
      - loki

  # Kafka Exporter - Kafka topic/consumer lag 指标
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: obs-kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
      - "--kafka.version=3.5.1"
    ports:
      - "9308:9308"
    networks:
      - crypto-network
    depends_on:
      kafka:
        condition: service_healthy
  # ==================== 数据卷 ====================
volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  flink-savepoints:
    driver: local
  clickhouse-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  redisinsight-data:
    driver: local

# ==================== 网络配置 ====================
networks:
  crypto-network:
    driver: bridge
