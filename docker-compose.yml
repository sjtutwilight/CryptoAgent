services:
  # ==================== 基础设施服务 ====================

  # Zookeeper服务
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.1
    container_name: crypto-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - crypto-network

  # Kafka服务
  kafka:
    image: confluentinc/cp-kafka:7.4.1
    container_name: crypto-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: on-failure:3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - crypto-network

  # Kafka UI服务
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: crypto-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: crypto-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - crypto-network

  # Redis服务
  redis:
    image: redis:7.2
    container_name: crypto-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - redis-data:/data
    networks:
      - crypto-network

  # Redis Commander - Redis管理界面

  redisinsight:
    image: redis/redisinsight:latest
    container_name: crypto-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    networks:
      - crypto-network
    depends_on:
      - redis
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: twilight
      POSTGRES_PASSWORD: twilight123
      POSTGRES_DB: twilight
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./runtime/batch/scripts:/scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twilight"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  # 数据库初始化
  init-db:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: twilight
      POSTGRES_PASSWORD: twilight123
      TEST_ENV: "true"
    volumes:
      - ./runtime/batch/scripts:/scripts
    command: ["/scripts/init.sh"]
    networks:
      - crypto-network

  # ==================== Flink 集群 ====================

  # Flink JobManager
  jobmanager:
    image: flink:1.20-scala_2.12-java17
    container_name: flink-jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081" # Flink Web UI
      - "9249:9249" # Prometheus metrics
    command: >
      bash -c "
        cp /opt/flink/custom-lib/*.jar /opt/flink/lib/ 2>/dev/null || true &&
        /docker-entrypoint.sh jobmanager
      "
    environment:
      APP_ENV: container
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 1
        rest.bind-address: 0.0.0.0
        web.submit.enable: true
        env.java.opts.jobmanager: --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.time=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED -Denv=container
        table.exec.source.idle-timeout: 30s
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        metrics.reporter.prom.host: 0.0.0.0
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      REALTIME_PIPELINE_CONFIG: /opt/flink/conf/realtime-pipeline.properties
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
    volumes:
      - ./config/config.yaml:/opt/flink/conf/config.yaml
      - ./config/realtime-pipeline.properties:/opt/flink/conf/realtime-pipeline.properties:ro
      - ./runtime/lib:/opt/flink/custom-lib
      - ./runtime/batch/sql:/opt/flink/sql
      - ./runtime/data:/opt/flink/data
      - ./runtime/logs:/opt/flink/log
      - ./runtime/checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./runtime/paimon-warehouse:/opt/flink/data/paimon-warehouse
    networks:
      - crypto-network

  # Flink TaskManager
  taskmanager:
    image: flink:1.20-scala_2.12-java17
    hostname: taskmanager
    depends_on:
      - jobmanager
    ports:
      - "9250-9260:9250" # Prometheus metrics (范围端口支持多个taskmanager)
    command: >
      bash -c "
        cp /opt/flink/custom-lib/*.jar /opt/flink/lib/ 2>/dev/null || true &&
        /docker-entrypoint.sh taskmanager
      "
    scale: 3
    environment:
      APP_ENV: container
      FLINK_PROPERTIES: |-
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 4
        env.java.opts.taskmanager: --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.time=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED -Denv=container
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
        metrics.reporter.prom.host: 0.0.0.0
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      REALTIME_PIPELINE_CONFIG: /opt/flink/conf/realtime-pipeline.properties
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
    volumes:
      - ./config/config.yaml:/opt/flink/conf/config.yaml
      - ./config/realtime-pipeline.properties:/opt/flink/conf/realtime-pipeline.properties:ro
      - ./runtime/lib:/opt/flink/custom-lib
      - ./runtime/batch/sql:/opt/flink/sql
      - ./runtime/data:/opt/flink/data
      - ./runtime/logs:/opt/flink/log
      - ./runtime/checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./runtime/paimon-warehouse:/opt/flink/data/paimon-warehouse
    networks:
      - crypto-network

