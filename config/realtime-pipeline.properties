# Realtime pipeline container配置（挂载到 /opt/flink/conf/realtime-pipeline.properties）
pipeline.environment=container

# Kafka 接入
kafka.bootstrap.servers=kafka:29092
kafka.group.id=realtime-pipeline
kafka.topic.ods.tx.eth=ods_tx_eth
kafka.topic.ods.tx.arb=ods_tx_arb
kafka.topic.ods.receipt.eth=ods_receipt_eth
kafka.topic.ods.receipt.arb=ods_receipt_arb
kafka.topic.ods.swap.eth=ods_dex_swap_eth
kafka.topic.ods.swap.arb=ods_dex_swap_arb
kafka.topic.dim.token=dim_token_basic_snapshot
kafka.topic.dim.pool=dim_dex_pool_snapshot
kafka.topic.dim.account=dim_account_basic_snapshot
kafka.topic.dim.token.price=dim_token_price_current
kafka.topic.dwd.swap=dwd_dex_swap

# Redis (account tag lookup)
redis.host=redis
redis.port=6379
redis.database=0
redis.password=
redis.timeout.ms=2000
redis.cache.max.size=200000
redis.cache.ttl.seconds=300

# Pipeline 参数
pipeline.parallelism=4
pipeline.checkpoint.interval.ms=60000
pipeline.min.pause.between.checkpoints.ms=30000
pipeline.state.ttl.minutes=10
pipeline.watermark.max.out_of_orderness.seconds=15

# Price lookup
price.lookup.max.age.seconds=30
price.enrichment.max.wait.ms=5000
