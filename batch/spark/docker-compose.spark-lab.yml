# Spark 实验环境 - 独立运行的 Spark + Paimon + StarRocks + Airflow 环境
# 使用方式: docker-compose -f runtime/batch/spark/docker-compose.spark-lab.yml up -d

services:
  # ==================== MinIO 对象存储 (S3兼容) ====================
  minio:
    image: minio/minio:latest
    container_name: spark-lab-minio
    hostname: minio
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - spark-lab-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO 初始化 - 创建必要的 bucket
  minio-mc:
    image: minio/mc:latest
    container_name: spark-lab-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set myminio http://minio:9000 admin password123 >/dev/null 2>&1; do
          sleep 0.5
        done

        # 确保可以访问
        mc ls myminio >/dev/null 2>&1 || exit 1

        # 创建必要的 bucket
        mc mb myminio/paimon-warehouse --ignore-existing
        mc mb myminio/spark-checkpoints --ignore-existing
        mc mb myminio/starrocks --ignore-existing

        # 为 StarRocks 创建 service account
        mc admin user svcacct add --access-key AAAAAAAAAAAAAAAAAAAA \
          --secret-key BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB \
          myminio \
          admin

        echo '✅ MinIO 初始化完成：buckets 和 service account 已创建'
        exit 0
    networks:
      - spark-lab-network

  # ==================== StarRocks OLAP 数据库 ====================
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: spark-lab-starrocks
    hostname: starrocks-allin1
    ports:
      - "9030:9030" # FE MySQL
      - "8030:8030" # FE HTTP
      - "9020:9020" # FE RPC
      - "9010:9010" # FE edit log
      - "8040:8040" # BE HTTP
      - "9060:9060" # BE
      - "9050:9050" # BE heartbeat
      - "8060:8060" # BE BRPC
    environment:
      - JAVA_OPTS=-Xmx2g
      - SR_RUN_MODE=shared_data
      - SR_CLOUD_NATIVE_STORAGE_TYPE=S3
      - SR_AWS_S3_ENDPOINT=minio:9000
      - SR_AWS_S3_PATH=starrocks
      - SR_AWS_S3_ACCESS_KEY=AAAAAAAAAAAAAAAAAAAA
      - SR_AWS_S3_SECRET_KEY=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
      - SR_AWS_S3_USE_HTTPS=false
      - SR_AWS_S3_REGION=us-east-1
    depends_on:
      minio-mc:
        condition: service_completed_successfully
    volumes:
      - starrocks-fe-meta:/opt/starrocks/fe/meta
      - starrocks-be-storage:/opt/starrocks/be/storage
      - starrocks-logs:/opt/starrocks/fe/log
    networks:
      - spark-lab-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW DATABASES;' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # StarRocks 初始化 - 创建必要的数据库和表
  starrocks-init:
    image: mysql:8.0
    container_name: spark-lab-starrocks-init
    depends_on:
      starrocks:
        condition: service_healthy
    volumes:
      - ../starrocks/starrocks-init.sql:/init.sql
    entrypoint:
      - sh
      - -c
      - |
        echo '正在初始化 StarRocks 数据库...'
        mysql -hstarrocks-allin1 -P9030 -uroot < /init.sql
        echo '✅ StarRocks 初始化完成'
        exit 0
    networks:
      - spark-lab-network

  # ==================== Spark Master ====================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-lab-master
    hostname: spark-master
    user: root
    ports:
      - "7077:7077" # Spark Master RPC
      - "8088:8080" # Spark Master Web UI
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./config:/opt/spark-config
      - spark-logs:/opt/spark/logs
    networks:
      - spark-lab-network
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== Spark Worker ====================
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-lab-worker
    hostname: spark-worker
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8089:8081" # Spark Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - SPARK_NO_DAEMONIZE=true
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./config:/opt/spark-config
      - spark-logs:/opt/spark/logs
    networks:
      - spark-lab-network
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081

  # ==================== Spark 客户端 (用于提交作业) ====================
  spark-client:
    image: apache/spark:3.5.0
    container_name: spark-lab-client
    hostname: spark-client
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
      minio-mc:
        condition: service_completed_successfully
    environment:
      - SPARK_MODE=client
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./config:/opt/spark-config
      - ./lib:/opt/spark/work-dir/lib
      - spark-logs:/opt/spark/logs
    networks:
      - spark-lab-network
    command: >
      bash -c "
        echo '✅ Spark 客户端已就绪'
        echo '使用以下命令提交作业:'
        echo 'docker exec -it spark-lab-client /opt/spark/bin/spark-submit ...'
        tail -f /dev/null
      "

  # ==================== Airflow 调度系统 ====================

  # PostgreSQL for Airflow metadata
  airflow-postgres:
    image: postgres:15
    container_name: spark-lab-airflow-postgres
    hostname: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    networks:
      - spark-lab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Airflow Webserver
  airflow-webserver:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: spark-lab-airflow-webserver
    hostname: airflow-webserver
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080" # Airflow Web UI
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=spark-lab-airflow-secret
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - PATH=/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
      - PYTHONPATH=/home/airflow/.local/lib/python3.10/site-packages
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - spark-lab-network
    command: ["bash", "-c", "/home/airflow/.local/bin/airflow webserver"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: spark-lab-airflow-scheduler
    hostname: airflow-scheduler
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - PATH=/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
      - PYTHONPATH=/home/airflow/.local/lib/python3.10/site-packages
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - spark-lab-network
    command: ["bash", "-c", "/home/airflow/.local/bin/airflow scheduler"]

  # Airflow 初始化
  airflow-init:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: spark-lab-airflow-init
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - PATH=/home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
      - PYTHONPATH=/home/airflow/.local/lib/python3.10/site-packages
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
    networks:
      - spark-lab-network
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # 初始化数据库
        /home/airflow/.local/bin/airflow db migrate
        # 创建用户
        /home/airflow/.local/bin/airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "✅ Airflow 初始化完成"

# ==================== 数据卷 ====================
volumes:
  minio-data:
    driver: local
  starrocks-fe-meta:
    driver: local
  starrocks-be-storage:
    driver: local
  starrocks-logs:
    driver: local
  spark-logs:
    driver: local
  airflow-postgres-data:
    driver: local

# ==================== 网络配置 ====================
networks:
  spark-lab-network:
    driver: bridge
