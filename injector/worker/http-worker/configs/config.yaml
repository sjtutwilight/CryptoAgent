server:
  port: 8081

kafka:
  brokers:
    - "localhost:9092"
  consumer:
    group_id: "http-worker-group"
    topics:
      tasks: "http.tasks"
    auto_offset_reset: "latest"
    session_timeout: 30000
    heartbeat_interval: 3000
  producer:
    retries: 3
    acks: "all"
    timeout: 5000

http:
  # HTTP客户端配置
  client:
    timeout: 10               # 请求超时（秒）
    connection_timeout: 5     # 连接超时（秒） 
    max_idle_conns: 100      # 最大空闲连接数
    max_conns_per_host: 20   # 每个主机最大连接数
    idle_conn_timeout: 60    # 空闲连接超时（秒）
    keep_alive: 30           # 连接保持时间（秒）

# 令牌桶配置
rate_limit:
  refill_interval_ms: 200    # 令牌补充间隔（毫秒）
  default_capacity: 100      # 默认桶容量
  default_refill_rate: 10    # 默认补充速率

# 数据源配置
datasources:
  mock-ethereum:
    url: "http://localhost:8090"
    rate_limit:
      interval: 60           # 限流时间窗口（秒）
      weight: 60         # 时间窗口内的权重限制
      cost_rule: "default"  # 费用计算规则
  coinmarketcap:
    url: "https://pro-api.coinmarketcap.com"
    rate_limit:
      interval: 60
      weight: 333
      cost_rule: "default"

# 日志配置
logging:
  level: "debug"            # debug, info, warn, error
  format: "json"           # json, text

# Topic映射配置
topic_mapping:
  data_topic_prefix: "data."     # 数据输出topic前缀
  status_topic: "tasks.status"   # 任务状态topic
  # 数据源到topic的映射
  datasource_topics:
    mock-ethereum: "data.ethereum"
    coinmarketcap: "data.coinmarketcap"
    binance: "data.binance"