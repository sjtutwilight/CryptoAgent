# Unified Worker配置

roles:
  # 角色1: WebSocket订阅MockDataProvider的newHeads
  - role_id: "mock-ethereum-ws"
    protocol: "websocket"
    task_type: "long_connection"

    data_source_config:
      data_source_id: "mock-ethereum"
      url: "ws://localhost:8090/ws"
      subscription: "newHeads"
      
    # Runtime配置（只列出需要的资源,没提到的默认不启用）
    resource:     
      reconnect:
        max_retries: -1  # -1表示无限重试
        backoff_base_seconds: 2
        backoff_max_seconds: 60
      
      heartbeat:
        interval_seconds: 30
        timeout_seconds: 60
    
    handler:
      reorder_detach:
        sequence_field: "number" 
        refill_config:
          url: "ws://localhost:8090/ws"
      kafka_sink:
        topic: "chain.ethereum.blocks"

  # 角色2: HTTP命令式单次查询
  - role_id: "mock-ethereum-http-onetime"
    protocol: "http"
    task_type: "one_time"
    
    data_source_config:
      data_source_id: "mock-ethereum"
      url: "http://localhost:8090/rpc"
    
    resource:  
      connection:
        timeout_seconds: 10
        read_timeout_seconds: 30
        write_timeout_seconds: 10
      
      rate_limit:
        capacity: 100
        refill_rate: 10  # 600次/分钟 = 10次/秒
 
      connection_pool:
        max_idle_conns: 5
        max_conns_per_host: 3
    
    handler:
      kafka_sink:
        topic: "chain.ethereum.blocks"

  # 角色3: 本地节点区块轮询
  - role_id: "localnode-block-polling"
    protocol: "go-ethereum-sdk"
    task_type: "polling"
    polling_interval: 2  # 每2秒轮询一次
    method: "block"
    
    data_source_config:
      data_source_id: "localnode"
      url: "http://localhost:8545"
    
    handler:
      parser: "DexParser"
      kafka_sink:
        topic: "dex_transaction"

  # 角色4: 本地节点余额轮询
  - role_id: "localnode-balance-polling"
    protocol: "go-ethereum-sdk"
    task_type: "polling"
    polling_interval: 60  # 每60秒轮询一次
    method: "balance"
    
    data_source_config:
      data_source_id: "localnode"
      url: "http://localhost:8545"
    
    handler:
      parser: "BalanceParser"
      kafka_sink:
        topic: "account_balance_snapshot"
