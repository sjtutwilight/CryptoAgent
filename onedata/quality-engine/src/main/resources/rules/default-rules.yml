# 数据质量规则配置文件
# 定义各业务域的质量检测规则

rules:
  # ===== DEX 规则 =====
  
  # DEX完整性规则
  - name: "dex.completeness.required_fields"
    domain: DEX_UNISWAP
    dimension: COMPLETENESS
    enabled: true
    config:
      required_fields:
        - "transaction"
        - "events"
      transaction_fields:
        - "transaction_hash"
        - "block_number"
        - "from_address"
        - "timestamp"
      alert_level: CRITICAL
      
  # DEX金额范围规则
  - name: "dex.accuracy.amount_range"
    domain: DEX_UNISWAP
    dimension: ACCURACY
    enabled: true
    config:
      min_amount: 0
      max_amount: 1000000000000  # 1万亿
      alert_level: WARNING
      
  # DEX时效性规则
  - name: "dex.timeliness.freshness"
    domain: DEX_UNISWAP
    dimension: TIMELINESS
    enabled: true
    config:
      window_ms: 60000
      max_delay_ms: 30000       # 30秒延迟告警
      critical_delay_ms: 120000 # 2分钟严重告警
      
  # DEX吞吐量规则
  - name: "dex.timeliness.throughput"
    domain: DEX_UNISWAP
    dimension: TIMELINESS
    enabled: true
    config:
      window_ms: 60000
      min_messages: 1           # 每分钟至少1条消息
      alert_level: WARNING

  # ===== K线规则 =====
  
  # K线完整性规则
  - name: "kline.completeness.required_fields"
    domain: CEX_KLINE
    dimension: COMPLETENESS
    enabled: true
    config:
      required_fields:
        - "symbol"
        - "interval"
        - "open"
        - "high"
        - "low"
        - "close"
        - "volume"
      alert_level: CRITICAL
      
  # K线价格范围规则
  - name: "kline.accuracy.price_range"
    domain: CEX_KLINE
    dimension: ACCURACY
    enabled: true
    config:
      min_price: 0
      max_price: 10000000       # 1000万
      alert_level: WARNING
      
  # K线时效性规则
  - name: "kline.timeliness.freshness"
    domain: CEX_KLINE
    dimension: TIMELINESS
    enabled: true
    config:
      window_ms: 60000
      max_delay_ms: 5000        # 5秒延迟告警
      critical_delay_ms: 30000  # 30秒严重告警
      
  # K线吞吐量规则
  - name: "kline.timeliness.throughput"
    domain: CEX_KLINE
    dimension: TIMELINESS
    enabled: true
    config:
      window_ms: 60000
      min_messages: 10          # 每分钟至少10条
      alert_level: WARNING

  # ===== 永续合约订单簿规则 =====
  
  # 订单簿完整性规则
  - name: "perp.orderbook.completeness"
    domain: CEX_PERP_ORDERBOOK
    dimension: COMPLETENESS
    enabled: true
    config:
      required_fields:
        - "symbol"
        - "bids"
        - "asks"
      min_depth: 5              # 至少5档深度
      alert_level: CRITICAL
      
  # 订单簿价格范围规则
  - name: "perp.orderbook.price_range"
    domain: CEX_PERP_ORDERBOOK
    dimension: ACCURACY
    enabled: true
    config:
      min_price: 0
      max_price: 10000000
      alert_level: WARNING
      
  # 订单簿时效性规则
  - name: "perp.orderbook.freshness"
    domain: CEX_PERP_ORDERBOOK
    dimension: TIMELINESS
    enabled: true
    config:
      window_ms: 60000
      max_delay_ms: 1000        # 1秒延迟告警（订单簿要求实时性高）
      critical_delay_ms: 5000   # 5秒严重告警
      
  # 订单簿吞吐量规则
  - name: "perp.orderbook.throughput"
    domain: CEX_PERP_ORDERBOOK
    dimension: TIMELINESS
    enabled: true
    config:
      window_ms: 60000
      min_messages: 100         # 每分钟至少100条
      alert_level: WARNING

  # ===== 永续合约成交规则 =====
  
  # 成交完整性规则
  - name: "perp.trades.completeness"
    domain: CEX_PERP_TRADES
    dimension: COMPLETENESS
    enabled: true
    config:
      required_fields:
        - "symbol"
        - "price"
        - "quantity"
        - "time"
      alert_level: CRITICAL

